<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="seal" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#D86858"/>
      <stop offset="100%" stop-color="#8E2A1F"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="100%" stop-color="#F2EBDA"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grain -->
  <rect width="1200" height="630" fill="#1A1814" opacity="0.02"/>

  <!-- seal stamp -->
  <circle cx="160" cy="160" r="76" fill="url(#seal)"/>
  <text x="160" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="500" fill="#F8F4EC">tm</text>

  <!-- brand -->
  <text x="270" y="172" font-family="Georgia, serif" font-size="42" fill="#1A1814">tomorrowme</text>

  <!-- headline -->
  <text x="600" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="500" fill="#1A1814" letter-spacing="-2">
    Say it now.
  </text>
  <text x="600" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="86" font-weight="500" fill="#B5392A" letter-spacing="-2">
    Reveal it then.
  </text>

  <!-- subline -->
  <text x="600" y="500" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#5C5650">
    Sealed by math. Opened by time.
  </text>

  <!-- footer line -->
  <line x1="200" y1="565" x2="1000" y2="565" stroke="#B5392A" stroke-opacity="0.4"/>
  <text x="600" y="595" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#8A8378" letter-spacing="2">
    SEALED · CLIENT-SIDE · TIME-LOCK ENCRYPTION
  </text>
</svg>
